name: Build MySynth

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write   # needed to attach files to a GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: MySynth-macOS
            build_path: build/MySynth_artefacts/Release
          - os: windows-latest
            artifact_name: MySynth-Windows
            build_path: build/MySynth_artefacts/Release
          - os: ubuntu-latest
            artifact_name: MySynth-Linux
            build_path: build/MySynth_artefacts/Release

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # JUCE on Linux needs these system libraries (ALSA, X11, WebKit, etc.)
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev \
            ladspa-sdk \
            libcurl4-openssl-dev \
            libfreetype6-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev \
            ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja

      # Puts whatever MSVC toolchain is actually installed on this runner
      # onto PATH (cl.exe, link.exe, etc.), without hardcoding a Visual
      # Studio version/generator name that may not match the runner image.
      # JUCE refuses to compile under MinGW's gcc (see
      # juce_TargetPlatform.h), which is what Ninja would otherwise find
      # first on PATH on a Windows runner.
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload build artifacts (CI)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.build_path }}/VST3/**
            ${{ matrix.build_path }}/AU/**
            ${{ matrix.build_path }}/Standalone/**
          if-no-files-found: warn

      # Zips whichever plugin format folders actually exist for this
      # platform (AU only exists on macOS, for example). cmake -E tar is
      # used instead of zip/Compress-Archive so this works identically on
      # macOS, Windows and Linux with no extra tool installs.
      - name: Package plugin zip for release
        if: github.event_name == 'release'
        shell: bash
        run: |
          mkdir -p dist
          cd "${{ matrix.build_path }}"
          targets=""
          for d in VST3 AU Standalone; do
            [ -d "$d" ] && targets="$targets $d"
          done
          cmake -E tar cf "$GITHUB_WORKSPACE/dist/${{ matrix.artifact_name }}.zip" --format=zip -- $targets

      - name: Attach zip to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
