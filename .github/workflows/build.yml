name: Build MySynth

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: MySynth-macOS
            build_path: build/MySynth_artefacts/Release
          - os: windows-latest
            artifact_name: MySynth-Windows
            build_path: build/MySynth_artefacts/Release
          - os: ubuntu-latest
            artifact_name: MySynth-Linux
            build_path: build/MySynth_artefacts/Release

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # JUCE on Linux needs these system libraries (ALSA, X11, WebKit, etc.)
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev \
            ladspa-sdk \
            libcurl4-openssl-dev \
            libfreetype6-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev \
            ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # Windows uses the Visual Studio generator instead of Ninja: JUCE
      # explicitly refuses to compile under MinGW (see juce_TargetPlatform.h),
      # and picking Ninja here risks CMake finding a MinGW gcc on PATH instead
      # of MSVC's cl.exe. The VS generator always targets MSVC.
      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Configure CMake (macOS/Linux)
        if: runner.os != 'Windows'
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.build_path }}/VST3/**
            ${{ matrix.build_path }}/AU/**
            ${{ matrix.build_path }}/Standalone/**
          if-no-files-found: warn
